[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "zerobirus"
version = "1.0.0"
description = "Portable Windows tool that detects and removes crypto miners, trojans and other malware."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "João Ferraz" }]
dependencies = ["psutil==7.2.2", "PySide6-Essentials==6.12.0"]

[project.scripts]
zerobirus = "zerobirus.cli:main"

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "hypothesis==6.170.13",
    "pytest-socket==0.8.1",
    "pytest-qt==4.5.0",
    "types-psutil==7.2.2.20260906",
]

# Mutation testing is a local audit tool, not part of CI: it is not in the default groups,
# so "uv sync --locked" in CI does not install it. Use: uv sync --group mutation
mutation = ["mutmut==3.8.0"]

# Dev and release builds of the Windows executable (CI only).
build = ["pyinstaller==6.22.3"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/zerobirus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The style sheet is CSS text; wrapping its lines would make it harder to read.
"src/zerobirus/ui/theme.py" = ["E501"]
"src/zerobirus/ui/catalog.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pyright]
include = ["src", "tests"]
exclude = ["mutants", "**/__pycache__"]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --strict-markers -ra"
markers = ["windows: runs only on real Windows (CI windows-latest)"]

[tool.mutmut]
source_paths = ["src/zerobirus/core/safety.py", "src/zerobirus/core/redact.py"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["tests/", "src/zerobirus/", "tools/"]
