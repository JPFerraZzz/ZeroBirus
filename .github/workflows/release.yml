name: Release

# A tag vX.Y.Z builds the ZIP, its SHA-256 file and a provenance attestation, and creates a
# DRAFT release for the owner to publish by hand. "Run workflow" (workflow_dispatch) is a dry
# run: it builds and uploads the artifact but publishes nothing. No tag may be pushed before
# the owner confirmed docs/WINDOWS_TEST_PLAN.md on a real Windows machine.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

env:
  UV_VERSION: "0.13.5"

jobs:
  build:
    name: Build ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      zip: ${{ steps.meta.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group build
      - name: Version from the code, and the tag must match it
        id: meta
        shell: pwsh
        run: |
          $version = (uv run python -c "import zerobirus; print(zerobirus.__version__)").Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $($env:GITHUB_REF_NAME) does not match the code version v$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=ZeroBirus-v$version-win64.zip" >> $env:GITHUB_OUTPUT
      - name: Version resource
        run: uv run python packaging/make_version_info.py packaging/version_info.txt
      - name: Build (onedir, administrator manifest)
        run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/zerobirus.spec
      - name: Smoke test the executables
        shell: pwsh
        run: |
          $cli = "dist\ZeroBirus\zerobirus-cli.exe"
          & $cli --version; if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $cli selftest; if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          & $cli scan --demo clean_pc --json --out demo.json; if ($LASTEXITCODE -ne 0) { throw "demo scan failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          Start-Process -FilePath "dist\ZeroBirus\ZeroBirus.exe" -ArgumentList "screenshots","--out","exe-shots","--scale","1.0" -Wait
          if (@(Get-ChildItem exe-shots -Filter *.png).Count -lt 6) { throw "the window executable did not render" }
          $exe = Get-Item "dist\ZeroBirus\ZeroBirus.exe"
          if ($exe.VersionInfo.CompanyName -ne "Ferraz") { throw "CompanyName is $($exe.VersionInfo.CompanyName)" }
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          if ($text -notmatch "requireAdministrator") { throw "no administrator manifest" }
      - name: Zip (with LEIA-ME.txt) and checksum
        shell: pwsh
        run: ./packaging/make_zip.ps1 -ZipName "${{ steps.meta.outputs.zip }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: ${{ steps.meta.outputs.zip }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerobirus-release-win64
          path: |
            ${{ steps.meta.outputs.zip }}
            SHA256SUMS.txt
          retention-days: 30

  draft-release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zerobirus-release-win64
      - name: Create the draft release (the owner publishes it by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ needs.build.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "ZeroBirus Alpha ${TAG}" \
            --notes "ALPHA. Unsigned build. Verify the SHA-256 against SHA256SUMS.txt (and the provenance attestation) before running. See LEIA-ME.txt inside the ZIP."
