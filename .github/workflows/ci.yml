name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  UV_VERSION: "0.13.5"

jobs:
  ubuntu:
    name: Ubuntu (lint, types, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --platform win32
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run zerobirus selftest

  windows:
    name: Windows (tests, windows marker, smoke)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run mypy
      - name: All tests (windows-marked tests run here, never skipped)
        run: uv run pytest -v -rs
      - name: Windows-marked tests only (visible in the log)
        run: uv run pytest -m windows -v -s
      - run: uv run zerobirus version
      - run: uv run zerobirus selftest
