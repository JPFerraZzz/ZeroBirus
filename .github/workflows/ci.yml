name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  UV_VERSION: "0.13.5"

jobs:
  ubuntu:
    name: Ubuntu (lint, types, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --platform win32
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run zerobirus selftest

  windows:
    name: Windows (tests, windows marker, smoke)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run mypy
      - name: All tests (windows-marked tests run here, never skipped)
        run: uv run pytest -v -rs
      - name: Windows-marked tests only (visible in the log)
        if: success() || failure()
        run: uv run pytest -m windows -v -s
      - run: uv run zerobirus version
      - run: uv run zerobirus selftest

  package:
    name: Windows dev build (PyInstaller onedir)
    runs-on: windows-latest
    needs: [ubuntu, windows]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --group build
      - name: Version resource
        run: uv run python packaging/make_version_info.py packaging/version_info.txt
      - name: Build (onedir, administrator manifest)
        run: uv run pyinstaller --noconfirm --distpath dist --workpath build packaging/zerobirus.spec
      - name: Smoke test the executable
        run: |
          $exe = "dist\ZeroBirus\ZeroBirus.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $exe selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }
          & $exe scan --demo clean_pc --json --out demo.json
          if ($LASTEXITCODE -ne 0) { throw "demo scan failed" }
          & $exe scan --json --out real.json --timeout 180
          if ($LASTEXITCODE -ne 0) { throw "real scan failed" }
          $demo = Get-Content demo.json -Raw | ConvertFrom-Json
          if ($demo.overall -ne "OK") { throw "demo overall is $($demo.overall)" }
          $real = Get-Content real.json -Raw | ConvertFrom-Json
          if ($real.checks.Count -ne 9) { throw "expected 9 checks" }
          "real scan overall: $($real.overall)"
      - name: Check version resource and administrator manifest
        run: |
          $item = Get-Item "dist\ZeroBirus\ZeroBirus.exe"
          if ($item.VersionInfo.CompanyName -ne "Ferraz") { throw "CompanyName is $($item.VersionInfo.CompanyName)" }
          if ($item.VersionInfo.ProductName -ne "ZeroBirus") { throw "ProductName is $($item.VersionInfo.ProductName)" }
          $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch "requireAdministrator") { throw "no administrator manifest" }
          "company: $($item.VersionInfo.CompanyName), description: $($item.VersionInfo.FileDescription)"
      - name: Zip and checksum
        run: |
          Compress-Archive -Path dist\ZeroBirus -DestinationPath ZeroBirus-dev-win64.zip
          $hash = (Get-FileHash ZeroBirus-dev-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ZeroBirus-dev-win64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerobirus-dev-win64
          path: |
            ZeroBirus-dev-win64.zip
            SHA256SUMS.txt
            demo.json
            real.json
          retention-days: 14
